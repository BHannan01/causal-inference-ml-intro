<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>Causal diagram for the 401(k) example</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00131D"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#FFFFFF"/>
  <g stroke="#00131D" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="250" y1="86" x2="170" y2="218"/>
    <line x1="430" y1="86" x2="510" y2="218"/>
    <line x1="272" y1="244" x2="406" y2="244"/>
    <line x1="235" y1="218" x2="285" y2="183" stroke="#4A5A66" stroke-width="1.5"/>
    <line x1="395" y1="183" x2="445" y2="218" stroke="#4A5A66" stroke-width="1.5"/>
    <line x1="262" y1="318" x2="175" y2="272" stroke-dasharray="6 4"/>
    <line x1="418" y1="318" x2="505" y2="272" stroke-dasharray="6 4"/>
  </g>
  <g>
    <rect x="160" y="20" width="360" height="66" rx="8" fill="#E6EDF3" stroke="#002F4C"/>
    <text x="340" y="41" text-anchor="middle" fill="#00131D" font-weight="bold">Confounders (X)</text>
    <text x="340" y="59" text-anchor="middle" fill="#00131D" font-size="13">income, age, education, family size, married,</text>
    <text x="340" y="76" text-anchor="middle" fill="#00131D" font-size="13">two earners, other pension, IRA, home owner</text>
    <rect x="40" y="220" width="230" height="48" rx="8" fill="#002F4C"/>
    <text x="155" y="249" text-anchor="middle" fill="#FFFFFF">Eligible for a 401(k) (D)</text>
    <rect x="408" y="220" width="232" height="48" rx="8" fill="#2E86BF"/>
    <text x="524" y="249" text-anchor="middle" fill="#FFFFFF">Net financial assets (Y)</text>
    <rect x="275" y="147" width="130" height="34" rx="8" fill="#FFFFFF" stroke="#4A5A66" stroke-dasharray="5 4"/>
    <text x="340" y="169" text-anchor="middle" fill="#00131D" font-size="13">Takes part (p401)</text>
    <rect x="215" y="300" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#4A5A66" stroke-dasharray="6 4"/>
    <text x="340" y="327" text-anchor="middle" fill="#00131D" font-size="14">Saving preference (U), not measured</text>
  </g>
  <text x="20" y="372" fill="#4A5A66" font-size="13">Shaded: measured confounders (adjusted for). Dashed: a confounder no one measured.</text>
  <text x="20" y="391" fill="#4A5A66" font-size="13">Taking part lies on the path from eligibility to assets (a mediator), so it does not go in X.</text>
</svg>
